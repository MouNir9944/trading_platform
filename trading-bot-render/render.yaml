services:
  - type: web
    name: trading-bot-dashboard
    runtime: node
    region: frankfurt # Binance blocks US IPs (Ohio/Oregon)
    # Always-on plan on purpose: the order monitor must keep running after a limit BUY fills so the
    # stop-loss/take-profit OCO gets placed. Free web services sleep when idle.
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: BINANCE_TESTNET
        value: "true"
      - key: TRADING_SYMBOL
        value: XLMUSDT
      - key: APP_USERNAME
        value: admin
      - key: MONGODB_DB
        value: trading_bot
      # Secrets: Render prompts for these on first deploy.
      - key: MONGODB_URI
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: BINANCE_API_KEY_real
        sync: false
      - key: BINANCE_API_SECRET_real
        sync: false
